<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Ayyan Siddiqui — CEO, IMTA</title>
  <meta name="description" content="Ali Ayyan Siddiqui, Chief Executive Officer at IMTA. Connect via LinkedIn or WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1b2d6e;
      --blue:   #2245ae;
      --teal:   #3ab5c3;
      --teal2:  #2a97a8;
      --gray:   #8a9ab5;
      --light:  #f4f7fb;
      --white:  #ffffff;
      --text:   #1c2b4a;
      --muted:  #5e6e8a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ── Background decoration ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(27,45,110,.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(58,181,195,.14) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Page wrapper ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      background: var(--white);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(27,45,110,.10),
        0 1px 4px  rgba(27,45,110,.06);
      overflow: hidden;
      position: relative;
    }

    /* Top accent stripe */
    .card__stripe {
      height: 6px;
      background: linear-gradient(90deg, var(--navy) 0%, var(--teal) 100%);
    }

    /* Right-side decorative bars (mirrors the physical card) */
    .card__deco {
      position: absolute;
      top: 6px;
      right: 0;
      height: calc(100% - 6px);
      width: 28px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }
    .card__deco span {
      flex: 1;
      display: block;
    }
    .card__deco span:nth-child(1) { background: var(--gray);  opacity: .55; }
    .card__deco span:nth-child(2) { background: var(--navy);  }
    .card__deco span:nth-child(3) { background: var(--teal);  }

    /* Card body */
    .card__body {
      padding: 36px 40px 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Logo section */
    .card__logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* IMTA logo image */
    .logo-img {
      height: 64px;
      width: auto;
      flex-shrink: 0;
    }

    /* Identity */
    .card__identity { display: flex; flex-direction: column; gap: 4px; }

    .card__name {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -.01em;
      line-height: 1.2;
    }

    .card__title {
      font-size: .95rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .01em;
    }

    /* Divider */
    .card__divider {
      height: 1px;
      background: linear-gradient(90deg, #e4eaf4 0%, transparent 100%);
      margin-right: 28px;
    }

    /* Contact list */
    .card__contacts {
      display: flex;
      flex-direction: column;
      gap: 13px;
      list-style: none;
    }

    .card__contacts li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: .88rem;
      color: var(--text);
    }

    .contact-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg { width: 16px; height: 16px; color: var(--navy); }

    .card__contacts a {
      color: var(--text);
      text-decoration: none;
      transition: color .2s;
    }
    .card__contacts a:hover { color: var(--blue); }

    /* Location badge */
    .card__location {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .8rem;
      color: var(--muted);
      background: var(--light);
      padding: 5px 12px;
      border-radius: 20px;
      align-self: flex-start;
    }
    .card__location svg { width: 13px; height: 13px; }

    /* ── CTA buttons ── */
    .cta-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      letter-spacing: .01em;
    }

    .btn:hover  { transform: translateY(-2px); filter: brightness(1.06); }
    .btn:active { transform: translateY(0);    filter: brightness(.96);  }

    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn--linkedin {
      background: linear-gradient(135deg, #0a66c2 0%, #084fa0 100%);
      color: #fff;
      box-shadow: 0 6px 22px rgba(10,102,194,.32);
    }

    .btn--whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #1ab553 100%);
      color: #fff;
      box-shadow: 0 6px 22px rgba(37,211,102,.30);
    }

    /* ── Footer ── */
    .footer {
      font-size: .75rem;
      color: var(--gray);
      text-align: center;
      letter-spacing: .01em;
    }
    .footer a { color: var(--teal2); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── Responsive tweaks ── */
    @media (max-width: 400px) {
      .card__body    { padding: 28px 24px 28px 24px; }
      .card__name    { font-size: 1.3rem; }
      .logo-img { height: 52px; }
      .btn           { font-size: .95rem; padding: 14px 18px; }
    }
  </style>
</head>
<body>
